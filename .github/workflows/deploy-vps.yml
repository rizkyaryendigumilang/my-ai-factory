name: Production CI/CD to VPS

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '.gitignore'
  workflow_dispatch:
    inputs:
      deploy_to_vps:
        description: 'Deploy bundle to VPS after successful build'
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: my-ai-factory-production-vps
  cancel-in-progress: false

jobs:
  build:
    name: Validate, test, and build Next.js application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated test suite
        run: npm test

      - name: Build Next.js production bundle
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build

      - name: Validate build output integrity
        run: |
          set -euo pipefail
          test -d .next || { echo "::error::.next build directory is missing"; exit 1; }
          test -d public || { echo "::error::public directory is missing"; exit 1; }
          test -f package.json || { echo "::error::package.json is missing"; exit 1; }
          test -f ecosystem.config.cjs || { echo "::error::ecosystem.config.cjs is missing"; exit 1; }
          echo "✓ Build output and configurations passed all integrity checks."

      - name: Package production release bundle
        run: |
          tar -czf release.tar.gz \
            .next \
            public \
            package.json \
            package-lock.json \
            next.config.js \
            ecosystem.config.cjs

      - name: Generate SHA256 checksum
        run: sha256sum release.tar.gz > release.tar.gz.sha256

      - name: Upload production release artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-ai-factory-release
          path: |
            release.tar.gz
            release.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy to Production VPS
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: my-ai-factory-release
          path: ./artifact

      - name: Validate artifact integrity before deployment
        run: |
          set -euo pipefail
          test -s ./artifact/release.tar.gz || { echo "::error::Downloaded release.tar.gz is missing or empty"; exit 1; }
          test -s ./artifact/release.tar.gz.sha256 || { echo "::error::Checksum file is missing"; exit 1; }
          cd ./artifact
          sha256sum -c release.tar.gz.sha256 || { echo "::error::SHA256 checksum mismatch"; exit 1; }
          echo "Artifact validated successfully."

      - name: Validate secrets and deploy to VPS
        id: deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USERNAME }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_PORT: ${{ secrets.VPS_SSH_PORT || secrets.VPS_PORT || '2222' }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${VPS_HOST:-}" ] || missing="$missing VPS_HOST"
          [ -n "${VPS_USER:-}" ] || missing="$missing VPS_USERNAME"
          [ -n "${VPS_KEY:-}" ] || missing="$missing VPS_SSH_KEY"
          [ -n "${VPS_SSH_KNOWN_HOSTS:-}" ] || missing="$missing VPS_SSH_KNOWN_HOSTS"

          if [ -n "$missing" ]; then
            echo "::error::Missing required secret(s):$missing. Configure in repository Settings > Secrets and variables > Actions."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$VPS_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"

          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

          ARCHIVE_NAME="release-${RELEASE_SHA}.tar.gz"
          cp ./artifact/release.tar.gz "./$ARCHIVE_NAME"

          echo "Uploading release bundle $ARCHIVE_NAME to $VPS_USER@$VPS_HOST ..."
          scp -o BatchMode=yes -o ConnectTimeout=30 -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -P "$VPS_PORT" "./$ARCHIVE_NAME" "$VPS_USER@$VPS_HOST:~/$ARCHIVE_NAME"

          echo "Applying release on VPS with atomic staging and zero-downtime PM2 reload..."
          ssh -o BatchMode=yes -o ConnectTimeout=30 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=yes -i "$HOME/.ssh/deploy_key" -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" "bash -s -- '/srv/www/my-ai-factory' 'my-ai-factory' '${RELEASE_SHA}' '$ARCHIVE_NAME'" <<'REMOTE'
          set -Eeuo pipefail
          live="$1"
          slug="$2"
          release="$3"
          archive="$HOME/$4"

          export PATH="/usr/bin:/usr/local/bin:$HOME/.nvm/versions/node/$(ls $HOME/.nvm/versions/node 2>/dev/null | tail -n 1)/bin:$PATH"

          # 1. Unban developer IP if fail2ban banned it
          sudo fail2ban-client set sshd unbanip 202.162.208.26 2>/dev/null || true

          # 2. Configure Caddy reverse proxy on port 8450 if not already configured
          if ! sudo grep -q ':8450' /etc/caddy/Caddyfile; then
            echo '--> Adding port 8450 reverse proxy to Caddyfile...'
            printf '\nhttps://43.156.236.102:8450 {\n    tls {\n        issuer acme {\n            profile shortlived\n        }\n    }\n    encode zstd gzip\n    reverse_proxy 127.0.0.1:3005\n}\n' | sudo tee -a /etc/caddy/Caddyfile >/dev/null
            sudo caddy validate --config /etc/caddy/Caddyfile
            sudo systemctl reload caddy
            echo '--> Caddy reloaded successfully on port 8450.'
          fi

          parent="$HOME/.deploy-$slug"
          stage="$parent/stage-$release"
          backup="$parent/backup-$release.tar.gz"

          test -s "$archive" || { echo "::error::Uploaded bundle is missing on VPS: $archive"; exit 1; }

          mkdir -p "$parent"
          mkdir -p "$live"
          rm -rf "$stage"
          mkdir -p "$stage"

          deploy_success=0
          rollback() {
            local exit_code=$?
            if [ "$deploy_success" -eq 1 ]; then
              return 0
            fi
            echo "::error::Deployment failure detected (exit code: $exit_code). Initiating rollback..."
            if [ -f "$backup" ] && [ -s "$backup" ]; then
              echo "Restoring previous release from backup: $backup ..."
              tar -xzf "$backup" -C "$live"
              pm2 reload "$slug" 2>/dev/null || true
            fi
            rm -rf "$stage"
            rm -f "$archive"
            exit "$exit_code"
          }
          trap rollback EXIT

          # Extract bundle to staging
          tar -xzf "$archive" -C "$stage"

          # Backup active release
          if [ "$(ls -A "$live" 2>/dev/null)" ]; then
            echo "Creating snapshot backup of current live release..."
            tar -czf "$backup" -C "$live" --exclude='.deploy*' --exclude='.next/cache*' .
          fi

          # Synchronize staged release to live
          rsync -a --delete --exclude='.data' --exclude='pb_data' --exclude='.env*' "$stage/" "$live/"

          # Install production dependencies inside live folder
          cd "$live"
          npm ci --omit=dev

          # Reload or start PM2 application process on port 3005
          if command -v pm2 >/dev/null 2>&1; then
            echo "Reloading process with PM2 on port 3005..."
            pm2 reload "$slug" --update-env 2>/dev/null || pm2 start ecosystem.config.cjs
            pm2 save || true
          fi

          # Verification health check on internal port 3005
          sleep 3
          curl -fsS http://localhost:3005/api/health >/dev/null && echo "✓ Healthcheck OK on port 3005" || echo "Warning: Healthcheck endpoint did not respond on localhost:3005"

          deploy_success=1
          echo "=========================================="
          echo "✅ MY AI FACTORY DEPLOYMENT SUCCESSFUL"
          echo "Live Path  : $live"
          echo "Release SHA: $release"
          echo "App Port   : 3005 (HTTPS 8450)"
          echo "=========================================="
          rm -rf "$stage"
          rm -f "$archive"
          REMOTE
